<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledgerline — Goals</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <nav class="rail" aria-label="Primary">
    <a class="rail__mark" href="dashboard.html">LEDGERLINE</a>
    <div class="rail__nav">
      <a class="tab" href="dashboard.html">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Home
      </a>
      <a class="tab" href="transactions.html">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        Ledger
      </a>
      <a class="tab" href="goals.html" aria-current="page">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
        Goals
      </a>
      <a class="tab" href="reports.html">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        Reports
      </a>
    </div>
    <div class="rail__foot">
      <a class="rail__signout" href="index.html">SIGN OUT</a>
    </div>
  </nav>

  <main class="main ruled">
    <div class="topline">
      <div>
        <p class="eyebrow">Savings goals</p>
        <h1 class="page-title">Goals</h1>
      </div>
      <div class="topline__meta"><span id="goalCount">0</span> active goals</div>
    </div>

    <section class="goals-grid" id="goalsGrid">
      <!-- goal cards rendered by script.js from shared goal data -->
      <button class="add-goal-card" id="addGoalCard" type="button" aria-haspopup="dialog" aria-controls="goalModal">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        New goal
      </button>
    </section>
  </main>
</div>

<div class="modal-backdrop" id="goalModal" data-open="false">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="goalModalTitle">
    <h3 id="goalModalTitle">New savings goal</h3>
    <p class="hint">It'll appear on this page right away.</p>
    <form id="goalForm">
      <div class="field">
        <label for="goalName">Goal name</label>
        <input type="text" id="goalName" placeholder="e.g. Wedding fund" required>
      </div>
      <div class="field">
        <label for="goalTarget">Target amount ($)</label>
        <input type="number" id="goalTarget" min="1" step="1" placeholder="2500" required>
      </div>
      <div class="field">
        <label for="goalSaved">Already saved ($)</label>
        <input type="number" id="goalSaved" min="0" step="1" placeholder="0">
      </div>
      <div class="field">
        <label for="goalDue">Target date</label>
        <input type="date" id="goalDue" required>
      </div>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" data-close-modal style="flex:1">Cancel</button>
        <button type="submit" class="btn btn--primary" id="goalSubmitBtn" style="flex:1">Create goal</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="fundsModal" data-open="false">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="fundsModalTitle">
    <h3 id="fundsModalTitle">Add funds</h3>
    <p class="hint" id="fundsGoalLabel">Adding to this goal.</p>
    <form id="fundsForm">
      <div class="field">
        <label for="fundsAmount">Amount ($)</label>
        <input type="number" id="fundsAmount" min="0.01" step="0.01" placeholder="100.00" required>
      </div>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" data-close-modal style="flex:1">Cancel</button>
        <button type="submit" class="btn btn--primary" id="fundsSubmitBtn" style="flex:1">Add funds</button>
      </div>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
