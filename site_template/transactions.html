<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledgerline — Transactions</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <nav class="rail" aria-label="Primary">
    <a class="rail__mark" href="dashboard.html">LEDGERLINE</a>
    <div class="rail__nav">
      <a class="tab" href="dashboard.html">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Home
      </a>
      <a class="tab" href="transactions.html" aria-current="page">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        Ledger
      </a>
      <a class="tab" href="goals.html">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
        Goals
      </a>
      <a class="tab" href="reports.html">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        Reports
      </a>
    </div>
    <div class="rail__foot">
      <a class="rail__signout" href="index.html">SIGN OUT</a>
    </div>
  </nav>

  <main class="main ruled">
    <div class="topline">
      <div>
        <p class="eyebrow">Full ledger</p>
        <h1 class="page-title">Transactions</h1>
      </div>
      <div class="topline__meta"><span id="txCount">0</span> entries</div>
    </div>

    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="text" id="txSearch" placeholder="Search by merchant, category, or note…" aria-label="Search transactions">
      </div>
      <div class="chip-row" role="group" aria-label="Filter by category">
        <button class="chip" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" data-filter="income" aria-pressed="false">Income</button>
        <button class="chip" data-filter="housing" aria-pressed="false">Housing</button>
        <button class="chip" data-filter="groceries" aria-pressed="false">Groceries</button>
        <button class="chip" data-filter="transport" aria-pressed="false">Transport</button>
        <button class="chip" data-filter="dining" aria-pressed="false">Dining</button>
        <button class="chip" data-filter="savings" aria-pressed="false">Savings</button>
        <button class="chip" data-filter="other" aria-pressed="false">Other</button>
      </div>
      <button class="btn btn--primary btn--sm" id="addEntryTrigger" type="button" aria-haspopup="dialog" aria-controls="txnModal">
        + Add entry
      </button>
    </div>

    <div class="card table-wrap">
      <table class="ledger-table" id="txTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Category</th>
            <th class="num">Amount</th>
            <th class="num" style="width:76px;"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody>
          <!-- rows rendered by script.js from shared ledger data -->
        </tbody>
      </table>
      <div class="empty-state" id="txEmpty">
        <h3>No entries match</h3>
        <p>Try a different search term or clear the category filter.</p>
      </div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="txnModal" data-open="false">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="txnModalTitle">
    <h3 id="txnModalTitle">New ledger entry</h3>
    <p class="hint">It'll be added to the top of the ledger right away.</p>
    <form id="txnForm">
      <div class="field">
        <label for="txnDesc">Description</label>
        <input type="text" id="txnDesc" placeholder="e.g. Fernwood Market" required>
      </div>
      <div class="field">
        <label for="txnDate">Date</label>
        <input type="date" id="txnDate" required>
      </div>
      <div class="field">
        <label for="txnType">Type</label>
        <select id="txnType">
          <option value="debit" selected>Withdrawal</option>
          <option value="credit">Deposit</option>
        </select>
      </div>
      <div class="field">
        <label for="txnCategory">Category</label>
        <select id="txnCategory">
          <option value="income">Income</option>
          <option value="housing">Housing</option>
          <option value="groceries" selected>Groceries</option>
          <option value="transport">Transport</option>
          <option value="dining">Dining</option>
          <option value="savings">Savings</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="txnAmount">Amount ($)</label>
        <input type="number" id="txnAmount" min="0.01" step="0.01" placeholder="42.00" required>
      </div>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" data-close-modal style="flex:1">Cancel</button>
        <button type="submit" class="btn btn--primary" id="txnSubmitBtn" style="flex:1">Add entry</button>
      </div>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
